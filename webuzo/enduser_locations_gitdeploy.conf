
# GitDeploy — enduser panel locations
# UI: root FPM (reads root-owned site config, generates deploy keys, writes spool).
# Auth is enforced in PHP via the Webuzo sessions SDK.
location ~ ^(/gitdeploy/|/gitdeploy/index\.php)$ {
	fastcgi_pass	unix:/usr/local/emps/var/fpm-root.sock;
	fastcgi_read_timeout 3600;
	fastcgi_index	index.php;
	fastcgi_param	SCRIPT_FILENAME  $document_root/gitdeploy/index.php;
	fastcgi_param	SCRIPT_NAME	  /gitdeploy/index.php;
	include			fastcgi_params;
}

# GitHub webhook: deliberately NON-root FPM (user webuzo). Auth = HMAC signature only.
location = /gitdeploy/hook.php {
	fastcgi_pass	unix:/usr/local/emps/var/fpm-webuzo.sock;
	fastcgi_read_timeout 30;
	client_max_body_size 10m;
	fastcgi_param	SCRIPT_FILENAME  $document_root$fastcgi_script_name;
	fastcgi_param	SCRIPT_NAME	  $fastcgi_script_name;
	include			fastcgi_params;
}


# GitDeploy — admin panel locations (ports 2004/2005)
# Server-owner overview: root FPM, because it reads root-owned site config, build
# status and logs for every account. Auth is enforced in PHP via the Webuzo
# sessions SDK — the page refuses to run unless is_admin_panel() is true, and a
# reseller only ever sees the accounts they own.
#
# There is deliberately NO webhook location here: the GitHub webhook is an
# enduser-panel endpoint only (see enduser_locations_gitdeploy.conf).
location ~ ^(/gitdeploy/|/gitdeploy/index\.php)$ {
	fastcgi_pass	unix:/usr/local/emps/var/fpm-root.sock;
	fastcgi_read_timeout 3600;
	fastcgi_index	index.php;
	fastcgi_param	SCRIPT_FILENAME  $document_root/gitdeploy/index.php;
	fastcgi_param	SCRIPT_NAME	  /gitdeploy/index.php;
	include			fastcgi_params;
}
